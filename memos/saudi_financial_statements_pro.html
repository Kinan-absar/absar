
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a1a;--ink2:#555;--ink3:#888;--line:#e0e0e0;--surf:#fff;--surf2:#f8f8f7;--surf3:#f2f1ef;--accent:#1a1a1a;--r:6px;--r2:10px}
body{font-family:'Arial',sans-serif;direction:rtl;font-size:13px;color:var(--ink);background:var(--surf2)}

.shell{display:flex;min-height:640px;background:var(--surf2)}
.side{width:190px;flex-shrink:0;background:var(--surf);border-left:1px solid var(--line);display:flex;flex-direction:column}
.side-logo{padding:16px 14px 12px;border-bottom:1px solid var(--line)}
.side-logo .logo-mark{width:28px;height:28px;background:var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.side-logo .logo-mark svg{width:16px;height:16px;fill:#fff}
.side-logo p{font-size:11px;font-weight:500;color:var(--ink);line-height:1.3}
.side-logo small{font-size:10px;color:var(--ink3);display:block;margin-top:1px}
.side-nav{flex:1;padding:8px 6px;overflow-y:auto}
.nav-group{margin-bottom:4px}
.nav-label{font-size:10px;color:var(--ink3);padding:8px 8px 3px;letter-spacing:.06em;font-weight:500}
.nav-item{display:flex;align-items:center;gap:7px;width:100%;padding:7px 8px;font-size:12px;border:none;background:none;color:var(--ink2);border-radius:var(--r);cursor:pointer;text-align:right}
.nav-item:hover{background:var(--surf2);color:var(--ink)}
.nav-item.active{background:var(--ink);color:#fff;font-weight:500}
.nav-item .icon{font-size:13px;flex-shrink:0}
.side-foot{padding:10px 12px;border-top:1px solid var(--line)}
.side-foot button{width:100%;padding:7px;font-size:12px;border:1px solid var(--ink);border-radius:var(--r);background:var(--ink);color:#fff;cursor:pointer;font-weight:500}
.side-foot button:hover{opacity:.85}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--surf);border-bottom:1px solid var(--line)}
.topbar-title{font-size:14px;font-weight:500;flex:1}
.topbar-sub{font-size:11px;color:var(--ink3);margin-top:1px}
.topbar-actions{display:flex;gap:6px}
.btn{padding:6px 13px;font-size:12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--surf);color:var(--ink);font-family:inherit}
.btn:hover{background:var(--surf2)}
.btn-dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-dark:hover{opacity:.85}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-ghost{border-color:transparent;background:none}
.btn-ghost:hover{background:var(--surf2)}
.btn-del{padding:2px 7px;font-size:10px;border:1px solid #fca5a5;border-radius:4px;background:none;cursor:pointer;color:#dc2626;opacity:.7}
.btn-del:hover{opacity:1;background:#fef2f2}
.btn-add{padding:4px 10px;font-size:11px;border:1px dashed var(--line);border-radius:var(--r);background:none;cursor:pointer;color:var(--ink3)}
.btn-add:hover{background:var(--surf2);color:var(--ink);border-color:var(--ink3)}

.content{flex:1;overflow-y:auto;padding:20px}

/* Cards */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;margin-bottom:14px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-hdr h3{font-size:13px;font-weight:500}
.card-hdr .badge{font-size:10px;padding:2px 8px;background:var(--surf2);border:1px solid var(--line);border-radius:20px;color:var(--ink3)}

/* Forms */
.field-grid{display:grid;gap:10px;margin-bottom:10px}
.field-grid.cols2{grid-template-columns:1fr 1fr}
.field-grid.cols3{grid-template-columns:1fr 1fr 1fr}
.field-grid.cols1{grid-template-columns:1fr}
label{font-size:11px;color:var(--ink2);display:block;margin-bottom:3px;font-weight:500}
input[type=text],select,textarea{width:100%;font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surf);color:var(--ink);font-family:inherit;transition:border-color .15s}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{resize:vertical;min-height:65px;line-height:1.6}

.creator-signature{
  text-align:center;
  padding:14px 18px;
  font-size:13px;
  color:#5f5f5f;
  background:linear-gradient(90deg, #fafaf8 0%, #f2f1ef 50%, #fafaf8 100%);
  border-top:1px solid #ddd8cf;
  letter-spacing:.2px;
  font-weight:500;
  box-shadow:0 -2px 8px rgba(0,0,0,.04);
}
.creator-signature strong{
  color:#b08d57;
  font-size:14px;
}
/* Statement tables */
.tbl-wrap{overflow-x:auto;margin-bottom:6px}
.stmt{width:100%;border-collapse:collapse;font-size:12px}
.stmt th{text-align:center;font-size:11px;font-weight:500;padding:8px 10px;background:var(--surf3);color:var(--ink2);border-bottom:1.5px solid var(--line);white-space:nowrap}
.stmt th.lft{text-align:right}
.stmt td{padding:5px 10px;border-bottom:1px solid #f0ede8;vertical-align:middle}
.stmt td.ctr{text-align:center}
.stmt td.num{text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stmt td.note{text-align:center;width:42px;color:var(--ink3);font-size:11px}
.stmt tr.sec td{background:var(--surf3);font-weight:500;font-size:12px;padding-top:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.stmt tr.tot td{font-weight:500;border-top:1.5px solid #c8c4bc;border-bottom:1px solid var(--line)}
.stmt tr.grand td{font-weight:500;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.stmt tr.sub td:first-child{padding-right:22px;color:var(--ink2)}
.stmt tr.spacer td{height:10px;border:none;background:transparent}
.stmt tr:hover:not(.sec):not(.tot):not(.grand):not(.spacer) td{background:#fafaf8}
.stmt input.cell-input{border:none;background:none;font-size:12px;font-family:inherit;color:var(--ink);width:100%;padding:0}
.stmt input.cell-input:focus{outline:1px solid var(--ink);outline-offset:1px;border-radius:2px;background:var(--surf)}
.stmt input.cell-input.ctr{text-align:center}

/* Add bar */
.add-bar{display:flex;gap:6px;align-items:center;padding:6px 0 8px;flex-wrap:wrap}

/* Note cards */
.note-card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:10px;overflow:hidden}
.note-hdr{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surf2)}
.note-num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.note-body{padding:12px 14px}
.note-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.note-table th{background:var(--surf3);text-align:center;padding:6px 8px;font-weight:500;border:1px solid var(--line)}
.note-table td{border:1px solid var(--line);padding:5px 8px;text-align:center}
.note-table td.lft{text-align:right;padding-right:12px}

/* Preview */
.preview-page{max-width:740px;margin:0 auto;background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);padding:32px 36px;margin-bottom:20px}
.preview-title{font-size:18px;font-weight:500;text-align:center;margin-bottom:3px}
.preview-sub{font-size:12px;color:var(--ink2);text-align:center;margin-bottom:6px}
.preview-sect{font-size:11px;font-weight:500;text-align:center;color:var(--ink3);margin-bottom:16px;letter-spacing:.03em}
.preview-info{display:flex;justify-content:center;margin-bottom:20px}
.preview-info table{font-size:11px;border-collapse:collapse}
.preview-info td{padding:3px 12px;border-bottom:1px solid var(--line)}
.preview-info td:first-child{color:var(--ink2);text-align:right;font-weight:500}
.preview-info td:last-child{color:var(--ink)}
.pstmt{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:6px}
.pstmt th{text-align:center;font-size:10.5px;font-weight:500;padding:7px 8px;background:var(--surf3);border-bottom:1.5px solid var(--line)}
.pstmt th.lft{text-align:right}
.pstmt td{padding:5px 8px;border-bottom:1px solid #f0ede8}
.pstmt td.num{text-align:center;font-variant-numeric:tabular-nums}
.pstmt td.note{text-align:center;width:36px;font-size:10px;color:var(--ink3)}
.pstmt tr.sec td{background:var(--surf3);font-weight:500;border-bottom:1px solid var(--line);font-size:11px}
.pstmt tr.tot td{font-weight:500;border-top:1.5px solid #c8c4bc}
.pstmt tr.grand td{font-weight:500;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.pstmt tr.sub td:first-child{padding-right:20px;color:var(--ink2)}
.pstmt tr.spacer td{height:8px;border:none;background:transparent}
.pfootnote{font-size:10px;color:var(--ink3);text-align:center;margin-top:8px;font-style:italic;border-top:1px solid var(--line);padding-top:7px}
.ppage-break{margin-top:28px;border-top:2px dashed var(--line);padding-top:28px}
.hint{font-size:11px;color:var(--ink3);margin-bottom:14px;padding:8px 12px;background:var(--surf3);border-radius:var(--r);border-right:3px solid #c8c4bc}
.note-table,
.pnote-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

.note-table th,
.note-table td,
.pnote-table th,
.pnote-table td{
  vertical-align:middle;
}

.note-table th:first-child,
.note-table td:first-child,
.pnote-table th:first-child,
.pnote-table td:first-child{
  width:56%;
}

.note-table th:nth-child(2),
.note-table td:nth-child(2),
.pnote-table th:nth-child(2),
.pnote-table td:nth-child(2){
  width:22%;

.note-table th:nth-child(3),
.note-table td:nth-child(3),
.pnote-table th:nth-child(3),
.pnote-table td:nth-child(3){

.note-col-head{

.note-col-head .yr{

}

.note-col-head .cur{
  font-size:10px;
  color:var(--ink3);
}

.note-table input[type=text]{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.pnote-wrap{
  margin-top:6px;
  margin-bottom:14px;
}
/* Eq table */
.eq-wrap{overflow-x:auto}
.eqtbl{border-collapse:collapse;font-size:12px;white-space:nowrap}
.eqtbl th,.eqtbl td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.eqtbl th{background:var(--surf3);font-weight:500;font-size:11px}
.eqtbl td:first-child{text-align:right;font-weight:500}
.eqtbl input.cell-input{border:none;background:none;font-size:12px;text-align:center;width:90px}
.eqtbl input.cell-input.wide{width:160px;text-align:right}
.eqtbl tr.tot-eq td{font-weight:500;border-top:2px solid var(--ink)}

@media print{
  body,
  .main,
  .content{
    background:#fff!important;
  }

  .shell{display:block}

  .side,
  .topbar,
  .topbar-actions,
  .btn,
  .btn-sm,
  .btn-add,
  .btn-del,
  .btn-dark,
  .add-bar,
  .creator-signature{
    display:none!important;
  }

  .content{
    padding:0!important;
  }

  .preview-page{
    border:none;
    padding:0;
    margin:26mm auto 0 auto;
    box-shadow:none;
    width:168mm;
    max-width:168mm;
    min-height:240mm;
    background:#fff!important;
    page-break-after:always;
    break-after:page;
    page-break-inside:avoid;
  }

  .preview-page:last-child{
    page-break-after:auto;
    break-after:auto;
  }
  .pnote-wrap{
  page-break-inside:avoid;
  break-inside:avoid;
}

.pnote-table th,
.pnote-table td{
  padding-top:6px;
  padding-bottom:6px;
}
}
</style>

const fmt=v=>{if(v===''||v===null||v===undefined)return '—';const n=parseFloat(String(v).replace(/,/g,''));if(isNaN(n))return v||'—';if(n<0)return '('+Math.abs(n).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})+')';return n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})};

const pageMeta={
  company:['معلومات الشركة','أدخل بيانات الشركة والفترة المالية'],

  preview:['معاينة وطباعة','القوائم المالية الكاملة جاهزة للطباعة']
};

function go(p){
  cur=p;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  const nb=document.getElementById('nav-'+p);if(nb)nb.classList.add('active');
  const m=pageMeta[p]||[p,''];
  document.getElementById('ttl').textContent=m[0];
  document.getElementById('tsub').textContent=m[1];
  const ct=document.getElementById('ct');ct.innerHTML='';
  ({company:renderCo,bs:renderBS,pl:renderPL,eq:renderEQ,cf:renderCF,notes:renderNotes,preview:renderPreview}[p]||renderCo)(ct);
}

function saveCo(){
  const f=(id)=>document.getElementById(id)?.value||'';
  Object.assign(S.co,{name:f('c-name'),type:f('c-type'),cr:f('c-cr'),vat:f('c-vat'),cur:f('c-cur'),addr:f('c-addr'),basis:f('c-basis'),yr:f('c-yr'),py:f('c-py'),pe:f('c-pe')});
  go('bs');
}

/* ── BS ──────────────────────────────────────────────────────────── */
function stmtHdr(y1,y2){
  return `<tr><th class="lft" style="width:48%">البيان</th><th style="width:36px">إيضاح</th><th>${y1}<br><small>${S.co.cur}</small></th><th>${y2}<br><small>${S.co.cur}</small></th><th style="width:28px"></th></tr>`;
}
function secRow(lbl,span=5){return `<tr class="sec"><td colspan="${span}">${lbl}</td></tr>`;}
function totRow(lbl,v1='',v2='',span1=1){return `<tr class="tot"><td colspan="${span1}">${lbl}</td>${span1===1?'<td></td>':''}<td class="num">${v1?fmt(v1):''}</td><td class="num">${v2?fmt(v2):''}</td><td></td></tr>`;}
function grandRow(lbl,v1='',v2=''){return `<tr class="grand"><td colspan="2">${lbl}</td><td class="num">${v1?fmt(v1):''}</td><td class="num">${v2?fmt(v2):''}</td><td></td></tr>`;}
function spacer(){return `<tr class="spacer"><td colspan="5"></td></tr>`;}
function edRows(arr,sec,pg){
  return arr.map((r,i)=>`<tr class="sub">
    <td><input class="cell-input" style="width:100%" value="${r.l||''}" placeholder="البيان" onchange="S.${pg}.${sec}[${i}].l=this.value"></td>
    <td class="note"><input class="cell-input ctr" style="width:36px" value="${r.n||''}" placeholder="—" onchange="S.${pg}.${sec}[${i}].n=this.value"></td>
    <td><input class="cell-input ctr" value="${r.v1||''}" placeholder="0.00" onchange="S.${pg}.${sec}[${i}].v1=this.value"></td>
    <td><input class="cell-input ctr" value="${r.v2||''}" placeholder="0.00" onchange="S.${pg}.${sec}[${i}].v2=this.value"></td>
    <td><button class="btn-del" onclick="S.${pg}.${sec}.splice(${i},1);go('${pg}')">✕</button></td>
  </tr>`).join('');
}
function addBtn(sec,pg,lbl='+ إضافة بند'){return `<tr><td colspan="5" style="padding:4px 8px;border:none"><button class="btn-add" onclick="S.${pg}.${sec}.push({l:'',v1:'',v2:'',n:''});go('${pg}')">${lbl}</button></td></tr>`;}

    ${pTotRow('النقد الناتج من / (المستخدم في) العمليات')}
    ${S.cf.zakat.map(r=>cfPRow(r)).join('')}
    ${pTotRow('صافي التدفقات النقدية من الأنشطة التشغيلية')}${pSpacer()}
    ${pSecRow('الأنشطة الاستثمارية:')}
    ${S.cf.inv.map(r=>cfPRow(r)).join('')}
    ${pTotRow('صافي التدفقات النقدية (المستخدمة في) الأنشطة الاستثمارية')}${pSpacer()}
    ${pSecRow('الأنشطة التمويلية:')}
    ${S.cf.fin.map(r=>cfPRow(r)).join('')}
    ${pTotRow('صافي التدفقات النقدية من الأنشطة التمويلية')}${pSpacer()}
    ${pTotRow('صافي التغير في النقد وما في حكمه')}
    ${S.cf.cashOpen.map(r=>cfPRow(r)).join('')}
    ${pGrandRow('النقد وما في حكمه في نهاية السنة')}
    </tbody></table>${pfn}
  </div>`;

  /* الإيضاحات */
  html+=`<div class="preview-page">
    <div class="preview-title">إيضاحات على القوائم المالية</div>
    <div class="preview-sub">للسنة المنتهية في ${c.pe}</div>
    ${S.notes.map(n=>`
      <div style="margin-bottom:16px">
        <div style="font-size:13px;font-weight:500;border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:7px">(${n.id}) ${n.title}</div>
        ${n.type==='text'
          ?`<p style="font-size:11.5px;color:var(--ink2);line-height:1.8">${n.text||'—'}</p>`
          :`<div class="pnote-wrap">
  <table class="pstmt pnote-table" style="font-size:11px"><thead><tr>${n.cols.map((col,ci)=>{
  if(col.includes('السنة الحالية')){
    return `<th>
      <div class="note-col-head">
        <span class="yr">${S.co.yr}</span>
        <span class="cur">${S.co.cur}</span>
      </div>
    </th>`;
  }

  if(col.includes('السنة السابقة')){
    return `<th>
      <div class="note-col-head">
        <span class="yr">${S.co.py}</span>
        <span class="cur">${S.co.cur}</span>
      </div>
    </th>`;
  }

  return `<th style="${ci===0?'text-align:right':''}">${col}</th>`;
}).join('')}</tr></thead><tbody>
            ${n.rows.map(row=>`<tr>${row.map((cell,ci)=>`<td ${ci===0?'style="text-align:right;padding-right:12px"':'class="num"'}>${cell||''}</td>`).join('')}</tr>`).join('')}
            </tbody></table></div>`}
      </div>`).join('')}
  </div>`;

  html+=`<div style="text-align:center;margin:16px 0 30px">
    <button class="btn btn-dark" onclick="window.print()">طباعة / حفظ PDF</button>
  </div>`;
  ct.innerHTML=html;
}
function getSafeFileName(name){
  return (name || 'financial_statements')
    .toString()
    .trim()
    .replace(/[\\/:*?"<>|]/g,'')
    .replace(/\s+/g,'_');
}
function autoSave(){
  try{
    localStorage.setItem('financial_app_data', JSON.stringify(S));
  }catch(e){
    console.warn('Auto save failed', e);
  }
}

function loadAutoSave(){
  try{
    const data = localStorage.getItem('financial_app_data');
    if(data){
      const parsed = JSON.parse(data);
      if(parsed && typeof parsed === 'object'){
        Object.keys(S).forEach(k => delete S[k]);
        Object.assign(S, parsed);
      }
    }
  }catch(e){
    console.warn('Load failed', e);
  }
}
function aoaToSheet(aoa){
  return XLSX.utils.aoa_to_sheet(aoa);
}

function exportExcel(){
  try{
    const wb = XLSX.utils.book_new();

    /* Company */
    const companyData = [
      ['البند','القيمة'],
      ['اسم الشركة', S.co.name],
      ['نوع الشركة', S.co.type],
      ['السجل التجاري', S.co.cr],
      ['الرقم الضريبي', S.co.vat],
      ['العنوان', S.co.addr],
      ['أساس الإعداد', S.co.basis],
      ['عملة العرض', S.co.cur],
      ['السنة الحالية', S.co.yr],
      ['السنة السابقة', S.co.py],
      ['تاريخ نهاية الفترة', S.co.pe]
    ];
    XLSX.utils.book_append_sheet(wb, aoaToSheet(companyData), 'Company');

    /* Balance Sheet */
    const bsData = [
      ['قائمة المركز المالي','','',S.co.yr,S.co.py],
      ['البيان','التصنيف','إيضاح','السنة الحالية','السنة السابقة']
    ];

    function pushSectionRows(arr, sectionName){
      arr.forEach(r=>{
        bsData.push([r.l || '', sectionName, r.n || '', r.v1 || '', r.v2 || '']);
      });
    }

    pushSectionRows(S.bs.ca,'الموجودات المتداولة');
    pushSectionRows(S.bs.nca,'الموجودات غير المتداولة');
    pushSectionRows(S.bs.eq,'حقوق الملكية');
    pushSectionRows(S.bs.cl,'المطلوبات المتداولة');
    pushSectionRows(S.bs.ncl,'المطلوبات غير المتداولة');

    XLSX.utils.book_append_sheet(wb, aoaToSheet(bsData), 'BS');

    /* Profit or Loss */
    const plData = [
      ['قائمة الربح أو الخسارة والدخل الشامل الآخر','','',S.co.yr,S.co.py],
      ['البيان','التصنيف','إيضاح','السنة الحالية','السنة السابقة']
    ];

    function pushPLRows(arr, sectionName){
      arr.forEach(r=>{
        plData.push([r.l || '', sectionName, r.n || '', r.v1 || '', r.v2 || '']);
      });
    }

    pushPLRows(S.pl.rev,'الإيرادات');
    pushPLRows(S.pl.cogs,'تكاليف الإيرادات');
    pushPLRows(S.pl.opex,'المصاريف التشغيلية');
    pushPLRows(S.pl.other,'بنود أخرى');

    XLSX.utils.book_append_sheet(wb, aoaToSheet(plData), 'PL');

    /* Equity */
    const eqData = [];
    eqData.push(['قائمة التغيرات في حقوق الملكية']);
    eqData.push(['البيان', ...S.eq.cols, 'الإجمالي']);
    eqData.push([`الرصيد في بداية السنة ${S.co.yr}`, ...S.eq.open, '']);
    S.eq.rows.forEach(r=>{
      eqData.push([r.l || '', ...(r.vals || []), '']);
    });
    eqData.push([`الرصيد في نهاية السنة ${S.co.yr}`, ...S.eq.close, '']);

    XLSX.utils.book_append_sheet(wb, aoaToSheet(eqData), 'EQ');

    /* Cash Flow */
    const cfData = [
      ['قائمة التدفقات النقدية','','',S.co.yr,S.co.py],
      ['البيان','التصنيف','','السنة الحالية','السنة السابقة']
    ];

    function pushCFRows(arr, sectionName){
      arr.forEach(r=>{
        cfData.push([r.l || '', sectionName, '', r.v1 || '', r.v2 || '']);
      });
    }

    pushCFRows(S.cf.op,'الأنشطة التشغيلية');
    pushCFRows(S.cf.adj,'تعديلات غير نقدية');
    pushCFRows(S.cf.wc,'التغيرات التشغيلية');
    pushCFRows(S.cf.zakat,'الزكاة');
    pushCFRows(S.cf.inv,'الأنشطة الاستثمارية');
    pushCFRows(S.cf.fin,'الأنشطة التمويلية');
    pushCFRows(S.cf.cashOpen,'أرصدة نقدية افتتاحية');

    XLSX.utils.book_append_sheet(wb, aoaToSheet(cfData), 'CF');

    /* Notes */
    const notesData = [['رقم الإيضاح','عنوان الإيضاح','النوع','البيان','السنة الحالية','السنة السابقة','النص']];

    S.notes.forEach(n=>{
      if(n.type === 'text'){
        notesData.push([n.id, n.title, 'text', '', '', '', n.text || '']);
      }else{
        (n.rows || []).forEach(row=>{
          notesData.push([
            n.id,
            n.title,
            'table',
            row[0] || '',
            row[1] || '',
            row[2] || '',
            ''
          ]);
        });
      }
    });

    XLSX.utils.book_append_sheet(wb, aoaToSheet(notesData), 'Notes');

    XLSX.writeFile(wb, `${getSafeFileName(S.co.name || 'saudi_financial_statements')}.xlsx`);
  }catch(err){
    alert('تعذر تصدير ملف Excel');
    console.error(err);
  }
}
